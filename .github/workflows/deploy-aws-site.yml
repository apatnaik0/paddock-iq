name: Deploy AWS Static Site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/deploy-aws-site.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-static-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      STACK_NAME: PaddockIqStaticSiteStack

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check AWS deploy secret
        id: aws_secret
        env:
          ROLE_ARN: ${{ secrets.AWS_SITE_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AWS_SITE_DEPLOY_ROLE_ARN is not configured; skipping AWS deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.aws_secret.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_SITE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve stack outputs
        if: steps.aws_secret.outputs.configured == 'true'
        id: stack_outputs
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='SiteBucketName'].OutputValue | [0]" \
            --output text)
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue | [0]" \
            --output text)
          echo "bucket=$BUCKET_NAME" >> "$GITHUB_OUTPUT"
          echo "distribution=$DISTRIBUTION_ID" >> "$GITHUB_OUTPUT"

      - name: Validate site output
        if: steps.aws_secret.outputs.configured == 'true'
        run: |
          test -f site/index.html

      - name: Sync site to S3
        if: steps.aws_secret.outputs.configured == 'true'
        run: |
          aws s3 sync site/ "s3://${{ steps.stack_outputs.outputs.bucket }}/" \
            --delete \
            --cache-control "public,max-age=300"

      - name: Invalidate CloudFront
        if: steps.aws_secret.outputs.configured == 'true'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack_outputs.outputs.distribution }}" \
            --paths "/*"
